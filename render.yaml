services:
  - type: web
    runtime: docker
    name: student-social-network-server
    plan: free
    dockerfilePath: ./BackEnd/Dockerfile
    dockerContext: ./BackEnd
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      # Aiven JDBC URL phải kết thúc bằng sslMode=REQUIRED và đúng database đang chứa schema hiện tại.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_TOKEN_SECRET
        sync: false
      - key: AUTH_OTP_HMAC_SECRET
        sync: false
      - key: AUTH_FLOW_TOKEN_HMAC_SECRET
        sync: false
      - key: AUTH_SOCIAL_IDENTITY_FINGERPRINT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_MODERATION_LOCAL_BASE_URL
        sync: false
      - key: FRONTEND_ALLOWED_ORIGINS
        value: https://student-social-network.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SERVER_MAX_THREADS
        value: "30"

  - type: web
    runtime: static
    name: student-social-network
    rootDir: FrontEnd
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://student-social-network-server.onrender.com
      - key: VITE_API_TIMEOUT_MS
        value: "75000"
      - key: VITE_API_WITH_CREDENTIALS
        value: "false"
      - key: VITE_PUBLIC_APP_URL
        value: https://student-social-network.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_FACEBOOK_APP_ID
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
