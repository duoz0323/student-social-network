spring:
  application:
    name: BackEnd
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_social_network?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+07:00'"
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 45MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

jwt:
  access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:}
  refresh-token-secret: ${JWT_REFRESH_TOKEN_SECRET:}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:900000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:2592000000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:student-social-network/avatars}
  post-folder: ${CLOUDINARY_POST_FOLDER:student-social-network/posts}

bootstrap-admin:
  enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  email: ${BOOTSTRAP_ADMIN_EMAIL:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Quản trị viên}
