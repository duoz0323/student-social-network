spring:
  application:
    name: BackEnd
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/student_social_network?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 3000
          timeout: 8000
          writetimeout: 8000
    default-encoding: UTF-8

jwt:
  access-token-secret: ${JWT_ACCESS_TOKEN_SECRET:}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:900000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:2592000000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  avatar-folder: ${CLOUDINARY_AVATAR_FOLDER:student-social-network/avatars}
  post-folder: ${CLOUDINARY_POST_FOLDER:student-social-network/posts}
  message-folder: ${CLOUDINARY_MESSAGE_FOLDER:student-social-network/messages}
  message-access-ttl: ${CLOUDINARY_MESSAGE_ACCESS_TTL:5m}

media:
  cleanup:
    enabled: ${MEDIA_CLEANUP_ENABLED:true}
    fixed-delay: ${MEDIA_CLEANUP_FIXED_DELAY:60000}
    batch-size: ${MEDIA_CLEANUP_BATCH_SIZE:50}
    retry-delay: ${MEDIA_CLEANUP_RETRY_DELAY:5m}

security:
  client-ip:
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: ${FRONTEND_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${FRONTEND_ALLOWED_HEADERS:Authorization,Content-Type,X-Auth-Flow-Token}
    exposed-headers: ${FRONTEND_EXPOSED_HEADERS:Authorization}
    allow-credentials: ${FRONTEND_ALLOW_CREDENTIALS:false}

auth:
  otp-delivery:
    sender-name: ${MAIL_SENDER_NAME:UniShare}
    otp-expiration: ${AUTH_OTP_EXPIRATION:10m}
  password-recovery:
    challenge-expiration: PT15M
    otp-expiration: PT10M
    resend-cooldown: PT60S
    reset-token-expiration: PT5M
    max-otp-attempts: 5
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    issuers: ${GOOGLE_ALLOWED_ISSUERS:accounts.google.com,https://accounts.google.com}
    clock-skew: ${GOOGLE_CLOCK_SKEW:30s}
    conflict-expiration: ${AUTH_SOCIAL_CONFLICT_EXPIRATION:5m}
    conflict-token-random-bytes: ${AUTH_SOCIAL_CONFLICT_TOKEN_RANDOM_BYTES:32}
    identity-fingerprint-secret: ${AUTH_SOCIAL_IDENTITY_FINGERPRINT_SECRET:}
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    graph-api-version: ${FACEBOOK_GRAPH_API_VERSION:v24.0}
    base-url: ${FACEBOOK_GRAPH_API_BASE_URL:https://graph.facebook.com}
    connect-timeout: ${FACEBOOK_CONNECT_TIMEOUT:3s}
    read-timeout: ${FACEBOOK_READ_TIMEOUT:5s}
  registration:
    otp-length: ${AUTH_OTP_LENGTH:6}
    otp-expiration: ${AUTH_OTP_EXPIRATION:10m}
    resend-cooldown: ${AUTH_RESEND_COOLDOWN:60s}
    max-otp-attempts: ${AUTH_MAX_OTP_ATTEMPTS:5}
    pending-expiration: ${AUTH_PENDING_EXPIRATION:24h}
    flow-token-random-bytes: ${AUTH_FLOW_TOKEN_RANDOM_BYTES:32}
    otp-hmac-secret: ${AUTH_OTP_HMAC_SECRET:}
    flow-token-hmac-secret: ${AUTH_FLOW_TOKEN_HMAC_SECRET:}
  reauthentication:
    expiration: ${AUTH_REAUTHENTICATION_EXPIRATION:5m}
  cleanup:
    enabled: ${AUTH_CLEANUP_ENABLED:false}
    fixed-delay: ${AUTH_CLEANUP_FIXED_DELAY:1h}
    retention: ${AUTH_CLEANUP_RETENTION:7d}
    batch-size: ${AUTH_CLEANUP_BATCH_SIZE:100}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:false}
    window: ${AUTH_RATE_LIMIT_WINDOW:1m}
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:30}

bootstrap-admin:
  enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
  email: ${BOOTSTRAP_ADMIN_EMAIL:}
  password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Quản trị viên}
  date-of-birth: ${BOOTSTRAP_ADMIN_DATE_OF_BIRTH:2000-01-01}

server:
  port: ${PORT:8080}
